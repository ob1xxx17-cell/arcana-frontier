<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>พรีวิวการ์ด</title>
<style>
  :root { --bg:#14161c; --panel:#1e222b; --line:#343a48; --fg:#e8eaf0; --mute:#9aa3b5; --accent:#e0b04a; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,"Noto Sans Thai",sans-serif; background:var(--bg); color:var(--fg); }
  header { padding:14px 20px; border-bottom:1px solid var(--line); display:flex; gap:12px; align-items:center; flex-wrap:wrap; position:sticky; top:0; background:var(--bg); z-index:2; }
  header h1 { font-size:18px; margin:0 12px 0 0; }
  button.tab { background:var(--panel); color:var(--fg); border:1px solid var(--line); padding:6px 14px; border-radius:6px; cursor:pointer; font:inherit; }
  button.tab.on { border-color:var(--accent); color:var(--accent); }
  main { padding:16px 20px 40px; }
  h2 { font-size:15px; color:var(--mute); margin:22px 0 10px; font-weight:600; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:10px; cursor:pointer; display:flex; flex-direction:column; gap:4px; min-height:120px; }
  .card:hover { border-color:var(--accent); }
  .card .nm { font-weight:600; font-size:14px; line-height:1.3; }
  .card .meta { font-size:12px; color:var(--mute); }
  .card .stat { margin-top:auto; font-size:13px; }
  .badge { display:inline-block; font-size:11px; padding:1px 6px; border-radius:4px; border:1px solid var(--line); color:var(--mute); margin-right:4px; }
  .badge.leader { color:var(--accent); border-color:var(--accent); }
  .badge.prop { color:#e07a5f; border-color:#e07a5f; }
  .t-monster { border-left:4px solid #c9a24a; } .t-spell { border-left:4px solid #3fa88a; }
  .t-fusion { border-left:4px solid #8a5fd0; } .t-grade4 { border-left:4px solid #d04a4a; }
  #modal { position:fixed; inset:0; background:rgba(0,0,0,.65); display:none; align-items:center; justify-content:center; padding:16px; z-index:5; }
  #modal.show { display:flex; }
  #detail { background:var(--panel); border:1px solid var(--line); border-radius:10px; max-width:520px; width:100%; max-height:90vh; overflow:auto; padding:20px; }
  #detail h3 { margin:0 0 6px; font-size:18px; }
  #detail dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:12px 0; font-size:14px; }
  #detail dt { color:var(--mute); } #detail dd { margin:0; }
  #detail p.txt { white-space:pre-wrap; line-height:1.55; font-size:14px; background:var(--bg); padding:10px; border-radius:6px; }
  #detail button { margin-top:8px; }
</style>
</head>
<body>
<header>
  <h1>พรีวิวการ์ด</h1>
  <span id="tabs"></span>
  <span id="count" style="color:var(--mute);font-size:13px"></span>
</header>
<main id="root"></main>
<div id="modal"><div id="detail"></div></div>

<script src="dinosaur.js"></script>
<script src="aquila.js"></script>
<script>
(function () {
  const TYPE_TH = { monster:'มอนสเตอร์', spell:'สเปล', fusion:'Fusion', grade4:'Grade 4' };
  const GROUP_TH = { normal:'ปกติ', set:'หมอบรอ', counter:'สวนกลับ' };
  const decks = CG.cards;
  const keys = Object.keys(decks);
  let current = keys[0];

  const el = (tag, cls, txt) => { const e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; };

  function statLine(c) {
    return c.type === 'spell' ? '' : 'ATK ' + c.atk + ' / DEF ' + c.def;
  }
  function metaLine(c) {
    const p = [TYPE_TH[c.type]];
    if (c.type === 'spell') p.push(GROUP_TH[c.group] || c.group);
    else p.push('Lv' + c.level);
    p.push('มานา ' + c.mana);
    return p.join(' · ');
  }

  function cardEl(c) {
    const d = el('div', 'card t-' + c.type);
    d.tabIndex = 0;
    d.appendChild(el('div', 'nm', c.name));
    d.appendChild(el('div', 'meta', metaLine(c)));
    const b = el('div', 'meta');
    if (c.leader) b.appendChild(el('span', 'badge leader', 'ผู้นำ'));
    if (c.field) b.appendChild(el('span', 'badge', 'การ์ดสนาม'));
    if (c.proposed_level) b.appendChild(el('span', 'badge prop', 'ข้อสมมติ'));
    if (c.count != null) b.appendChild(el('span', 'badge', '×' + c.count));
    d.appendChild(b);
    d.appendChild(el('div', 'stat', statLine(c)));
    const open = () => showDetail(c);
    d.addEventListener('click', open);
    d.addEventListener('keydown', e => { if (e.key === 'Enter') open(); });
    return d;
  }

  function showDetail(c) {
    const box = document.getElementById('detail');
    box.innerHTML = '';
    box.appendChild(el('h3', null, c.name));
    box.appendChild(el('div', 'meta', c.id));
    const dl = el('dl');
    const row = (k, v) => { if (v === undefined || v === null || v === '') return; dl.appendChild(el('dt', null, k)); dl.appendChild(el('dd', null, String(v))); };
    row('ประเภท', TYPE_TH[c.type]);
    if (c.type === 'spell') { row('กลุ่ม', GROUP_TH[c.group] || c.group); row('การ์ดสนาม', c.field ? 'ใช่' : 'ไม่'); }
    else { row('Level', c.level); row('ATK', c.atk); row('DEF', c.def); }
    row('มานา', c.mana);
    row('จำนวนในเด็ค', c.count);
    if (c.type === 'monster') row('ผู้นำ', c.leader ? 'ใช่' : 'ไม่');
    row('วัสดุ', c.materials);
    if (c.proposed_level) row('หมายเหตุ', 'Level เป็นข้อสมมติ ยังไม่ยืนยัน');
    row('effects', c.effects.length + ' รายการ');
    box.appendChild(dl);
    box.appendChild(el('p', 'txt', c.text));
    const close = el('button', 'tab', 'ปิด');
    close.addEventListener('click', hide);
    box.appendChild(close);
    document.getElementById('modal').classList.add('show');
  }
  function hide() { document.getElementById('modal').classList.remove('show'); }
  document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') hide(); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape') hide(); });

  function render() {
    const d = decks[current];
    const root = document.getElementById('root');
    root.innerHTML = '';
    const sec = (title, list) => {
      root.appendChild(el('h2', null, title + ' (' + list.length + ' แบบ)'));
      const g = el('div', 'grid');
      list.forEach(c => g.appendChild(cardEl(c)));
      root.appendChild(g);
    };
    const total = d.main.reduce((s, c) => s + c.count, 0);
    document.getElementById('count').textContent = d.name + ' · main ' + total + ' ใบ · extra ' + d.extra.length + ' ใบ';
    sec('Main Deck', d.main);
    sec('Extra Deck', d.extra);
    document.querySelectorAll('button.tab[data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === current));
  }

  const tabs = document.getElementById('tabs');
  keys.forEach(k => {
    const b = el('button', 'tab', decks[k].name);
    b.dataset.k = k;
    b.addEventListener('click', () => { current = k; render(); });
    tabs.appendChild(b);
  });
  render();
})();
</script>
</body>
</html>
